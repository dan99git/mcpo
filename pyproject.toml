[project]
name = "mcpo"
version = "1.0.0-rc1"
description = "OpenHubUI - Universal AI Infrastructure Hub for OpenWebUI. MCP tools proxy with future support for multi-provider AI and audio services."
authors = [
    { name = "Timothy Jaeryang Baek", email = "tim@openwebui.com" },
    { name = "OpenWebUI Community" }
]
readme = "README.md"
license = { text = "MIT" }
keywords = ["mcp", "openapi", "openwebui", "ai", "proxy", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.8",
    "fastapi>=0.115.12",
    "mcp==2.0.0",
    "mcp[cli]==2.0.0",
    "fastmcp==4.0.0b1",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.11.1",
    "pyjwt[crypto]>=2.10.1",
    "python-dotenv>=1.1.0",
    "pyyaml>=6.0.2",
    "typer>=0.15.2",
    "uvicorn>=0.34.0",
    "watchdog>=4.0.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/open-webui/mcpo"
Documentation = "https://github.com/open-webui/mcpo/blob/main/README.md"
Repository = "https://github.com/open-webui/mcpo"
Issues = "https://github.com/open-webui/mcpo/issues"
Changelog = "https://github.com/open-webui/mcpo/blob/main/CHANGELOG.md"

[project.scripts]
mcpo = "mcpo:app"
mcpp-proxy = "mcpo.proxy:main"
mcpp = "mcpo.proxy:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpo"]

[tool.hatch.build.targets.wheel.force-include]
"static" = "mcpo/static"
"skills/skill-creator" = "mcpo/bundled_skills/skill-creator"
"skills/skill-installer" = "mcpo/bundled_skills/skill-installer"
"THIRD_PARTY_NOTICES.md" = "mcpo/THIRD_PARTY_NOTICES.md"

[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "static",
    "skills/skill-creator",
    "skills/skill-installer",
    "tests",
    "docs/MODEL_CAPABILITY_FORGE.md",
    "CHANGELOG.md",
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "README.md",
    "pyproject.toml",
    "pytest.ini",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.23.0",
    "requests>=2.32.0",
]

[tool.uv]
prerelease = "allow"
