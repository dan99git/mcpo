name: mcpo-site-${BOS_VENDOR_SITE_ID:?Set BOS_VENDOR_SITE_ID in .env.gateway-poc}

services:
  gateway-mcpo:
    image: mcpo-gateway-poc:local
    build:
      context: .
      dockerfile: Dockerfile.gateway-poc
    init: true
    labels:
      ai.lighting.product-role: vendor-connector
      ai.lighting.runtime-role: site-connector-container
      ai.lighting.runtime-lineage: mcpo
      ai.lighting.site-id: "${BOS_VENDOR_SITE_ID:?Set BOS_VENDOR_SITE_ID in .env.gateway-poc}"
    ports:
      - "127.0.0.1:${BOS_VENDOR_SITE_ID:?Set BOS_VENDOR_SITE_ID in .env.gateway-poc}:8351"
    environment:
      BOS_VENDOR_SITE_ID: "${BOS_VENDOR_SITE_ID:?Set BOS_VENDOR_SITE_ID in .env.gateway-poc}"
      VENDOR_PUBLIC_DOMAIN: "${VENDOR_PUBLIC_DOMAIN:?Set VENDOR_PUBLIC_DOMAIN in .env.gateway-poc}"
      MCPO_API_KEY: "${MCPO_GATEWAY_CONSENT_KEY:?Set MCPO_GATEWAY_CONSENT_KEY in .env.gateway-poc}"
      BOS_VENDOR_SITE_ACCESS_KEY: "${BOS_VENDOR_SITE_ACCESS_KEY:?Set BOS_VENDOR_SITE_ACCESS_KEY in .env.gateway-poc}"
    volumes:
      - gateway_poc_data:/data
      - ./deploy/gateway-poc/config.gateway-poc.json:/data/mcpo.json:ro
    command:
      - --config
      - /data/mcpo.json
      - --host
      - 0.0.0.0
      - --port
      - "8351"
      - --oauth
      - --public-url
      - "https://${BOS_VENDOR_SITE_ID:?Set BOS_VENDOR_SITE_ID in .env.gateway-poc}.${MCPO_GATEWAY_PUBLIC_DOMAIN:?Set MCPO_GATEWAY_PUBLIC_DOMAIN in .env.gateway-poc}"
      - --log-level
      - info
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: "1.0"
    mem_limit: 512m
    mem_reservation: 128m
    pids_limit: 256
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://localhost:8351/.well-known/oauth-authorization-server
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

volumes:
  gateway_poc_data:
